[project]
name = "agent-studio-freshdesk-connector"
version = "1.0.0"
description = "Read-only Freshdesk MCP connector for Razorpay Agent Studio agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
freshdesk-mcp = "freshdesk_connector.server:main"
freshdesk-cli = "freshdesk_connector.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
